[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "taskflow"
version = "1.0.0"
description = "A role-based task and project management system"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-login==0.6.3",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.2.2",
    "werkzeug==3.1.6",
    "gunicorn==23.0.0",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
